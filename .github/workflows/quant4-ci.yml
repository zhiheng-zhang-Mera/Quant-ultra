name: Quant-4 engineering gates

on:
  push:
    branches: ["8-4", "8-5"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Quant-4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Quant-4/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q Main Phase_1 Phase_2 Phase_3 Phase_4 Phase_5 Phase_6 Phase_7 Phase_8 Phase_9 Phase_10 Phase_11
      - run: python -m pytest -q -p no:cacheprovider tests/test_improvements.py
      - run: python -m Main.production_readiness
