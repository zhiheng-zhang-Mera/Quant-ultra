[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ultra-research-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8", "PyYAML>=6"]

[project.scripts]
quant-research-workbench = "research_workbench.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_workbench*"]

[tool.setuptools.package-data]
research_workbench = ["qml/*.qml", "qml/components/*.qml"]
